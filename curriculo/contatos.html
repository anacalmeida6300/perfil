<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Feedback - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 20px;
        }

        .form-container {
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-voltar {
            border-color: #6f42c1;
            color: #320781;
            font-weight: 500;
        }

        .form-label {
            font-weight: 700;
            color: #000000;
            font-size: 0.9rem;
        }

        .btn-enviar {
            background-color: #f789c3;
            border: none;
            padding: 10px 30px;
            border-radius: 30px;
        }

        .form-check-label {
            font-weight: 600;
            color: #000000;
        }

        .botao-Voltar {
            position: relative;
            right: 350px;
            
        }
    </style>
</head>

<body>

    <div class="container mb-4">
        <button class="btn btn-outline-primary btn-voltar text-uppercase btn-sm botao-Voltar"><a href="index.html">Voltar</a></button>
    </div>

    <main class="container d-flex justify-content-center">
        <div class="form-container w-100">
            <h2 class="text-center mb-4" style="color: #0d1b44; font-weight: 700;">Formulário de Feedback</h2>

            <form>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">Primeiro Nome:</label>
                        <input type="text" class="form-control" id="nome">
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Último Nome:</label>
                        <input type="text" class="form-control" id="ultimoNome">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email">
                </div>

                <div class="mb-3">
                    <label for="points" class="form-label">Diga pontos interessantes deste perfil :</label>
                    <textarea class="form-control" id="points" rows="4"></textarea>
                </div>
          

                <div class="mb-3">
                    <label class="form-label">Qual seu gosto musical?</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rock">
                        <label class="form-check-label" for="rock">Rock</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="pop" checked>
                        <label class="form-check-label" for="pop">Pop</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="classic">
                        <label class="form-check-label" for="classic">Clássica</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="electro">
                        <label class="form-check-label" for="electro">Eletrônica</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="other">
                        <label class="form-check-label" for="other">Outra</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Qual nota daria para este perfil?</label>
                    <div class="d-flex flex-wrap gap-3">
                        <div class="form-check form-check-inline m-0">
                            <label class="me-1 fw-bold">1</label>
                            <input class="form-check-input" type="radio" name="rating" value="1">
                        </div>
                        <div class="form-check form-check-inline m-0">
                            <label class="me-1 fw-bold">2</label>
                            <input class="form-check-input" type="radio" name="rating" value="2">
                        </div>
                        <div class="form-check form-check-inline m-0">
                            <label class="me-1 fw-bold">...</label>
                            <input class="form-check-input" type="radio" name="rating" value="10">
                            <label class="ms-1 fw-bold">10</label>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="comment" class="form-label">Adicione um comentário:</label>
                    <textarea class="form-control" id="comment" rows="3"></textarea>
                </div>

                <div class="text-center">
                    <button type="button" class="btn btn-primary btn-enviar" onclick="enviarEmail()">
                        <i class="bi bi-send-fill me-2"></i> Enviar
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
 <script>
       function enviarEmail() {
   const nome = document.getElementById('nome').value;
   const ultimoNome = document.getElementById('ultimoNome').value;
   const email = document.getElementById('email').value;


   if (!nome || !ultimoNome || !email) {
       alert("Por favor, preencha todos os campos antes de enviar.");
       return;
   }


   const emailDestino = "nascimentodealmeidaanaclara15@gmail.com";
   const assunto = encodeURIComponent(`Proposta de Vaga: ${ultimoNome}`);
   const corpoEmail = encodeURIComponent(`Olá, meu nome é ${nome}.\n\nMensagem/Proposta:\n${email}`);


   const urlGmail = `https://mail.google.com/mail/?view=cm&fs=1&to=${emailDestino}&su=${assunto}&body=${corpoEmail}`;




   window.open(urlGmail, '_blank');
}
   </script>
</html>
